name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s orchestration-quality-control/scripts/tests -t orchestration-quality-control/scripts -p 'test_*.py'
          python3 -m unittest discover -s orchestration-quality-control/adapters/codex/tests -p 'test_*.py'
          python3 -m unittest discover -s orchestration-quality-control/adapters/claude/tests -p 'test_*.py'
          python3 -m unittest discover -s orchestration-quality-control/adapters/cursor/tests -p 'test_*.py'
          python3 -m unittest discover -s orchestration-quality-control/adapters/agy/tests -p 'test_*.py'
          python3 -m unittest discover -s eval-harness/tests -p 'test_*.py'

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0

